# EAPI: única porta pública (pelo Traefik). Várias réplicas atrás do mesmo Service:
# o Traefik e o Service distribuem os pedidos (demo de escalabilidade e load balancer).
apiVersion: v1
kind: Service
metadata:
  name: eapi
spec:
  selector:
    app: eapi
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eapi
  strategy:
    rollingUpdate:
      maxUnavailable: 0 # numa atualização há sempre réplicas prontas
      maxSurge: 1
  template:
    metadata:
      labels:
        app: eapi
    spec:
      # Sem as variáveis <SERVICO>_PORT/_HOST que o Kubernetes injeta por cada Service (usa-se o DNS)
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # utilizador "node" da imagem
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # A EAPI acaba os pedidos em curso e fecha as ligações no SIGTERM (sai à força ao fim de 10 s)
      terminationGracePeriodSeconds: 20
      containers:
        - name: eapi
          image: garms-eapi # o Kustomize troca pelo endereço do GHCR (ver kustomization.yaml)
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: garms-config
            - secretRef:
                name: garms-eapi # REDIS_URL e RABBITMQ_URL (criado por deploy/k8s/secrets.mjs)
          ports:
            - name: http
              containerPort: 3000
          # Liveness: só o processo (se o Redis cair, a EAPI não deve ser reiniciada)
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # Readiness: Redis e RabbitMQ ligados; senão a réplica sai do load balancer
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
