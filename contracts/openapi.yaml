    AlertaWebhook:
      type: object
      properties:
        alertId:
          type: string
          example: tmrw-alert-98765
        eventType:
          type: string
          example: ALERT_START
        data:
          type: object
          additionalProperties: true
          example:
            location: 37.74,-25.67
            type: heavy_rain
            severity: moderate
      required:
      - alertId
      - eventType
      - data
      description: Formato do fornecedor de alertas; a EAPI não o interpreta, só o reencaminha
  responses:
    NaoAutenticado:
      description: Sem token, ou token expirado ou inválido (assinatura, emissor ou audience)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: NAO_AUTENTICADO
            mensagem: Sessão expirada.
    NaoEncontrado:
      description: Não existe ou não pertence ao utilizador (404 em vez de 403, NFR-05)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: NAO_ENCONTRADO
            mensagem: Recurso não encontrado.
    Validacao:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: VALIDACAO
            mensagem: Há campos inválidos.
            campos:
            - campo: nome
              erro: máximo 45 caracteres
    DemasiadosPedidos:
      description: Demasiados pedidos (rate limiting da EAPI)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: DEMASIADOS_PEDIDOS
            mensagem: Tente daqui a pouco.
      headers:
        Retry-After:
          schema:
            type: integer
            example: 30
