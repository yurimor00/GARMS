# Configuração do Redis do GARMS (cache partilhada por todas as réplicas)
# A password NÃO está aqui: é passada no arranque a partir de REDIS_PASSWORD.

# Dentro do container escuta em todas as interfaces; no compose a porta só é publicada em 127.0.0.1
bind 0.0.0.0
protected-mode yes
port 6379

# Memória: é uma cache. Todas as chaves do GARMS têm TTL (previsão 30 min, alertas 24 h,
# rate limiting, sub → idUtilizador), por isso, se encher, saem primeiro as menos usadas com TTL.
maxmemory 256mb
maxmemory-policy volatile-lru

# Persistência leve: sobrevive a reinícios (ex.: alertId já vistos não voltam a ser enviados).
# AOF com fsync a cada segundo; sem snapshots RDB.
appendonly yes
appendfsync everysec
save ""

# Comandos perigosos desligados (ninguém deve apagar a cache toda ou mudar a config por engano)
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
