# Configuração do RabbitMQ do GARMS (montada em /etc/rabbitmq/conf.d/)

# A topologia (definitions.json) NÃO é carregada aqui com load_definitions: nesse caso o
# RabbitMQ deixa de criar o utilizador do .env. Quem a aplica é o serviço rabbitmq-init.

# O utilizador guest fica só para ligações dentro do container
loopback_users.guest = true
