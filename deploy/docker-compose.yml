# GARMS: ambiente local (Docker Desktop)
# Correr a partir da raiz do repositório:
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
# Tem o MySQL, o RabbitMQ, o Redis, a EAPI, o Cloudflare Tunnel e um nginx de teste;
# os outros serviços e o frontend entram aqui depois.
# Depois de mudar o código de um serviço: acrescentar --build ao "up -d".

name: garms

services:
  # EAPI (porta 3000): única porta pública. Imagem construída a partir da raiz (packages/common).
  eapi:
    build:
      context: ..
      dockerfile: services/eapi/Dockerfile
    image: garms-eapi:local
    container_name: garms-eapi
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Dentro do compose os hosts são os nomes dos serviços (não localhost).
      # As passwords vão no URL: se tiverem caracteres especiais (@ : / #), têm de estar em URL-encoding no .env.
      REDIS_URL: redis://:${REDIS_PASSWORD:?Falta REDIS_PASSWORD no .env}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Falta RABBITMQ_USER no .env}:${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD no .env}@rabbitmq:5672/garms
    ports:
      - "127.0.0.1:${EAPI_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully


  mysql:
    image: mysql:8.4
    container_name: garms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD no .env}
      MYSQL_PW_USER_SAPI: ${MYSQL_PW_USER_SAPI:?Falta MYSQL_PW_USER_SAPI no .env}
      MYSQL_PW_WARDROBE_SAPI: ${MYSQL_PW_WARDROBE_SAPI:?Falta MYSQL_PW_WARDROBE_SAPI no .env}
      MYSQL_PW_RECO: ${MYSQL_PW_RECO:?Falta MYSQL_PW_RECO no .env}
    command:
      # Instantes guardados em UTC (convenção da BD)
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - garms-mysql-data:/var/lib/mysql
      # Os mesmos scripts que se correm no Azure (fonte única)
      - ../database:/garms/database:ro
      - ./mysql/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      # 127.0.0.1 (TCP) para só ficar "healthy" depois do init terminar
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # RabbitMQ: broker de eventos (exchange dw.events). Topologia em rabbitmq/definitions.json.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: garms-rabbitmq
    # Os dados ficam em mnesia/rabbit@<hostname>: hostname fixo para não os perder ao recriar
    hostname: garms-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Falta RABBITMQ_USER no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD no .env}
      RABBITMQ_DEFAULT_VHOST: garms
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      # Painel de gestão só no próprio PC (nunca exposto pelo túnel)
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - garms-rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/10-garms.conf:/etc/rabbitmq/conf.d/10-garms.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Corre uma vez depois do RabbitMQ estar "healthy" e aplica a topologia pela API de gestão
  # (exchange dw.events, filas e dead-letter). Idempotente: pode correr a cada "up".
  rabbitmq-init:
    image: rabbitmq:3.13-management
    container_name: garms-rabbitmq-init
    restart: "no"
    environment:
      RMQ_USER: ${RABBITMQ_USER:?Falta RABBITMQ_USER no .env}
      RMQ_PASS: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD no .env}
    entrypoint: ["sh", "-c"]
    command:
      - rabbitmqadmin -H rabbitmq -P 15672 -u "$$RMQ_USER" -p "$$RMQ_PASS" import /garms/definitions.json
    volumes:
      - ./rabbitmq/definitions.json:/garms/definitions.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Redis: cache partilhada (previsão do tempo, alertas, rate limiting, sub → idUtilizador).
  redis:
    image: redis:7.4-alpine
    container_name: garms-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD no .env}
      # O redis-cli do healthcheck lê a password daqui (não aparece nos argumentos)
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # $$ = variável lida dentro do container (a password não fica escrita no comando do compose)
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      # Só no próprio PC (os serviços a correr no Windows usam localhost)
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - garms-redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Redis Insight: painel para ver chaves, TTL, memória e comandos em tempo real (Profiler).
  # Já vem ligado ao Redis; abrir em http://localhost:5540. Só para depurar, nunca exposto.
  # Profile "ferramentas": NÃO arranca com o "up -d" normal. Ligar e desligar à mão:
  #   docker compose --env-file .env -f deploy/docker-compose.yml up -d redisinsight
  #   docker compose --env-file .env -f deploy/docker-compose.yml stop redisinsight
  redisinsight:
    image: redis/redisinsight:3.10.2
    container_name: garms-redisinsight
    profiles: ["ferramentas"]
    # Não volta a arrancar sozinho (nem quando o Docker Desktop reinicia)
    restart: "no"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: GARMS (local)
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD no .env}
      # Salta o ecrã dos termos; a telemetria fica desligada nas definições
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    # Sem volume de propósito: a ligação vem destas variáveis a cada arranque,
    # e assim a password não fica guardada num volume.
    depends_on:
      redis:
        condition: service_healthy

  # Cloudflare Tunnel: liga o domínio a este ambiente sem abrir portas no router.
  # O destino de cada hostname é configurado no painel do Zero Trust e usa o nome
  # do serviço do compose (ex.: http://nginx:8080), nunca localhost.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: garms-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # O cloudflared lê o token desta variável (não aparece no docker ps)
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Falta CLOUDFLARE_TUNNEL_TOKEN no .env}
    depends_on:
      - nginx

  # nginx de teste: substituído pelo frontend (e pelo Traefik no cluster) mais tarde.
  # Sem "ports": só é acessível pelo túnel, dentro da rede do compose.
  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: garms-nginx
    restart: unless-stopped

volumes:
  garms-mysql-data:
  garms-rabbitmq-data:
  garms-redis-data:
