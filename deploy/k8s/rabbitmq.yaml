# RabbitMQ: StatefulSet com 1 réplica e volume persistente. Painel de gestão só por port-forward:
#   kubectl -n garms port-forward svc/rabbitmq 15672    → http://localhost:15672
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: gestao
      port: 15672
      targetPort: gestao
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # Sem as variáveis <SERVICO>_PORT/_HOST que o Kubernetes injeta por cada Service (usa-se o DNS)
      enableServiceLinks: false
      securityContext:
        fsGroup: 999 # utilizador "rabbitmq" da imagem (escreve no volume)
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: garms-rabbitmq
                  key: user
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: garms-rabbitmq
                  key: password
            - name: RABBITMQ_DEFAULT_VHOST
              value: garms
          ports:
            - name: amqp
              containerPort: 5672
            - name: gestao
              containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: dados
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d/10-garms.conf
              subPath: 10-garms.conf
              readOnly: true

        # Topologia (o mesmo que o rabbitmq-init do compose): espera pelo broker no próprio pod,
        # importa definitions.json pela API de gestão e fica parado. Como está no mesmo pod,
        # volta a correr sempre que o pod arranca ou o ConfigMap muda (o Kustomize muda-lhe o nome).
        - name: topologia
          image: rabbitmq:3.13-management
          env:
            - name: RMQ_USER
              valueFrom:
                secretKeyRef:
                  name: garms-rabbitmq
                  key: user
            - name: RMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: garms-rabbitmq
                  key: password
          command:
            - sh
            - -c
            - |
              until rabbitmqadmin -H 127.0.0.1 -u "$RMQ_USER" -p "$RMQ_PASS" list vhosts >/dev/null 2>&1; do
                echo "à espera do RabbitMQ..."; sleep 5
              done
              rabbitmqadmin -H 127.0.0.1 -u "$RMQ_USER" -p "$RMQ_PASS" import /garms/definitions.json
              echo "topologia aplicada"
              exec sleep infinity
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /garms/definitions.json
              subPath: definitions.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
