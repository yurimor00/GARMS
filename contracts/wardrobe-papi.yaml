openapi: 3.1.0
info:
  title: Digital Wardrobe — Wardrobe PAPI (Process API)
  version: 1.0.1
  description: |-
    Process API das peças, fotos e conjuntos, com as regras de posse (cada um só vê e altera o que é seu) e as validações do catálogo.

    - **Consumidor:** só a EAPI, que envia o utilizador autenticado em `X-User-Id`.
    - **Dependências:** Wardrobe SAPI.
    - **Publica:** `wardrobe.piece.changed`, `wardrobe.outfit.changed`, `wardrobe.favourite.changed`.
    - **Consome:** `user.deleted` (apaga as fotos do utilizador no bucket; o resto já saiu por CASCADE).

    IDs inteiros e nomes de campos iguais às colunas da base de dados. Erros no formato `Erro`. Todos os pedidos levam `X-Internal-Api-Key`.
servers:
- url: http://wardrobe-papi.internal:3006/api/v1
  description: Rede privada (não acessível da internet)
- url: http://localhost:3006/api/v1
  description: Desenvolvimento local
security:
- chaveInterna: []
tags:
- name: Resumos
- name: Peças
- name: Conjuntos
paths:
  /summary:
    parameters:
    - $ref: '#/components/parameters/XUserId'
    get:
      operationId: getSummary
      summary: Contadores do utilizador
      description: |-
        **Usado por:** EAPI (ACC-04).

        **Chama:** Wardrobe SAPI GET /stats.
      tags:
      - Resumos
      responses:
        '200':
          description: Contadores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contadores'
        '401':
          $ref: '#/components/responses/ChaveInterna'
  /favourites/summary:
    parameters:
    - $ref: '#/components/parameters/XUserId'
    get:
      operationId: getFavouritesSummary
      summary: Resumo dos favoritos
      description: |-
        **Usado por:** EAPI (PER-04).

        **Chama:** Wardrobe SAPI GET /stats.
      tags:
      - Resumos
      responses:
        '200':
          description: Favoritos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoFavoritos'
        '401':
          $ref: '#/components/responses/ChaveInterna'
  /export:
    parameters:
    - $ref: '#/components/parameters/XUserId'
    get:
      operationId: exportWardrobe
      summary: Exportar o guarda-roupa
      description: |-
        **Usado por:** EAPI (PER-07).

        **Chama:** Wardrobe SAPI GET /export.
      tags:
      - Resumos
      responses:
        '200':
          description: Dados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportacaoGuardaRoupa'
        '401':
          $ref: '#/components/responses/ChaveInterna'
  /pieces:
    parameters:
    - $ref: '#/components/parameters/XUserId'
    get:
      operationId: listPieces
      summary: Listar peças
      description: |-
        **Usado por:** EAPI (WDB-01).

        **Chama:** Wardrobe SAPI GET /pieces.
      tags:
      - Peças
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          example: casaco
      - name: idCategoria
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          example: 3
      - name: estacao
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Estacao'
      - name: corNome
        in: query
        required: false
        schema:
          type: string
          example: azul
      - name: favorita
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 24
      responses:
        '200':
          description: Peças
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PecaResumo'
                required:
                - items
          headers:
            X-Total-Count:
              description: Número total de resultados (paginação)
              schema:
                type: integer
                example: 34
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '422':
          $ref: '#/components/responses/Validacao'
    post:
      operationId: createPiece
      summary: Criar peça
      description: |-
        **Usado por:** EAPI (ADD-02).

        **Chama:** Wardrobe SAPI POST /pieces.

        **Publica:** `wardrobe.piece.changed` (criada).
      tags:
      - Peças
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PecaCriar'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peca'
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '404':
          description: Foto inexistente ou de outro utilizador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: FOTO_INVALIDA
                mensagem: Foto inexistente ou de outro utilizador
        '422':
          $ref: '#/components/responses/Validacao'
  /pieces/{idPeca}:
    parameters:
    - $ref: '#/components/parameters/XUserId'
    - name: idPeca
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        example: 42
    get:
      operationId: getPiece
      summary: Obter peça
      description: |-
        **Usado por:** EAPI (WDB-03).

        **Chama:** Wardrobe SAPI GET /pieces/{idPeca}.
      tags:
      - Peças
      responses:
        '200':
          description: Peça
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peca'
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      operationId: updatePiece
      summary: Editar peça
      description: |-
        **Usado por:** EAPI (WDB-04).

        Valida categoria e etiquetas no catálogo. **Chama:** Wardrobe SAPI PATCH /pieces/{idPeca}.

        **Publica:** `wardrobe.piece.changed` (alterada).
      tags:
      - Peças
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PecaAlterar'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peca'
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/Validacao'
    delete:
      operationId: deletePiece
      summary: Eliminar peça (lógica)
      description: |-
        **Usado por:** EAPI (WDB-06).

        **Chama:** Wardrobe SAPI PATCH /pieces/{idPeca} {eliminadaData}.

        **Publica:** `wardrobe.piece.changed` (eliminada).
      tags:
      - Peças
      responses:
        '204':
          description: Eliminada
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /pieces/{idPeca}/favourite:
    parameters:
    - $ref: '#/components/parameters/XUserId'
    - name: idPeca
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        example: 42
    put:
      operationId: setPieceFavourite
      summary: Marcar peça como favorita
      description: |-
        **Usado por:** EAPI (WDB-05).

        **Chama:** Wardrobe SAPI PATCH /pieces/{idPeca} {favorita}.

        **Publica:** `wardrobe.favourite.changed`.
      tags:
      - Peças
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Favorita'
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorita'
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /photos:
    parameters:
    - $ref: '#/components/parameters/XUserId'
    post:
      operationId: uploadPhoto
      summary: Carregar foto da peça
      description: |-
        **Usado por:** EAPI (ADD-01).

        Valida formato e tamanho. **Chama:** Wardrobe SAPI POST /photos?tipo=peca.
      tags:
      - Peças
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FicheiroImagem'
      responses:
        '201':
          description: Guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foto'
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '413':
          description: Ficheiro maior que 5 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: FICHEIRO_GRANDE
                mensagem: Ficheiro maior que 5 MB
        '415':
          description: Formato não suportado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: FORMATO_INVALIDO
                mensagem: Formato não suportado
  /outfits:
    parameters:
    - $ref: '#/components/parameters/XUserId'
    get:
      operationId: listOutfits
      summary: Listar conjuntos
      description: |-
        **Usado por:** EAPI (OTF-01).

        **Chama:** Wardrobe SAPI GET /outfits.
      tags:
      - Conjuntos
      parameters:
      - name: codigoEstilo
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Estilo'
      - name: conjuntoFavorito
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 15
      responses:
        '200':
          description: Conjuntos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conjunto'
                required:
                - items
          headers:
            X-Total-Count:
              description: Número total de resultados (paginação)
              schema:
                type: integer
                example: 34
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '422':
          $ref: '#/components/responses/Validacao'
    post:
      operationId: createOutfit
      summary: Criar conjunto
      description: |-
        **Usado por:** EAPI (OTF-03).

        Verifica posse e que nenhuma peça está eliminada. **Chama:** Wardrobe SAPI GET /pieces?ids=, POST /outfits.

        **Publica:** `wardrobe.outfit.changed` (criado).
      tags:
      - Conjuntos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConjuntoCriar'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conjunto'
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '404':
          description: Peça de outro utilizador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: PECA_INVALIDA
                mensagem: Peça de outro utilizador
        '422':
          $ref: '#/components/responses/Validacao'
  /outfits/{idConjunto}:
    parameters:
    - $ref: '#/components/parameters/XUserId'
    - name: idConjunto
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        example: 9
    get:
      operationId: getOutfit
      summary: Obter conjunto
      description: |-
        **Usado por:** EAPI (OTF-02).

        **Chama:** Wardrobe SAPI GET /outfits/{idConjunto}.
      tags:
      - Conjuntos
      responses:
        '200':
          description: Conjunto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conjunto'
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      operationId: updateOutfit
      summary: Editar conjunto
      description: |-
        **Usado por:** EAPI (OTF-04).

        **Chama:** Wardrobe SAPI GET /pieces?ids= (se mudarem as peças), PATCH /outfits/{idConjunto}.

        **Publica:** `wardrobe.outfit.changed` (alterado).
      tags:
      - Conjuntos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConjuntoAlterar'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conjunto'
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/Validacao'
    delete:
      operationId: deleteOutfit
      summary: Eliminar conjunto
      description: |-
        **Usado por:** EAPI (OTF-05).

        **Chama:** Wardrobe SAPI DELETE /outfits/{idConjunto}.

        **Publica:** `wardrobe.outfit.changed` (eliminado).
      tags:
      - Conjuntos
      responses:
        '204':
          description: Eliminado
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /outfits/{idConjunto}/favourite:
    parameters:
    - $ref: '#/components/parameters/XUserId'
    - name: idConjunto
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        example: 9
    put:
      operationId: setOutfitFavourite
      summary: Marcar conjunto como favorito
      description: |-
        **Usado por:** EAPI (OTF-06).

        **Chama:** Wardrobe SAPI PATCH /outfits/{idConjunto} {conjuntoFavorito}.

        **Publica:** `wardrobe.favourite.changed`.
      tags:
      - Conjuntos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConjuntoFavorito'
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConjuntoFavorito'
        '401':
          $ref: '#/components/responses/ChaveInterna'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
components:
  securitySchemes:
    chaveInterna:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: Chave partilhada entre serviços na rede privada. Só a EAPI é pública.
  schemas:
    ResumoFavoritos:
      type: object
      properties:
        pecas:
          type: integer
          example: 6
        conjuntos:
          type: integer
          example: 2
      required:
      - pecas
      - conjuntos
    Contadores:
      type: object
      properties:
        pecas:
          type: integer
          example: 34
        conjuntos:
          type: integer
          example: 9
        usos:
          type: integer
          example: 51
      required:
      - pecas
      - conjuntos
      - usos
    ConjuntoAlterar:
      type: object
      properties:
        nome:
          type: string
          example: Ida à faculdade (inverno)
          minLength: 1
          maxLength: 45
        codigoEstilo:
          oneOf:
          - $ref: '#/components/schemas/Estilo'
          - type: 'null'
        pecas:
          type: array
          items:
            type: integer
            minimum: 1
            example: 42
          minItems: 2
          uniqueItems: true
      minProperties: 1
    Estilo:
      type: string
      enum:
      - casual
      - minimalista
      - classico
      - elegante
      - desportivo
      - streetwear
      - boho
      example: casual
    ConjuntoCriar:
      type: object
      properties:
        nome:
          type: string
          example: Ida à faculdade
          minLength: 1
          maxLength: 45
        codigoEstilo:
          $ref: '#/components/schemas/Estilo'
        pecas:
          type: array
          items:
            type: integer
            minimum: 1
            example: 42
          minItems: 2
          uniqueItems: true
          description: idPeca; 2 ou mais, sem peças eliminadas
      required:
      - nome
      - pecas
    Conjunto:
      type: object
      properties:
        idConjunto:
          type: integer
          minimum: 1
          example: 9
        nome:
          type: string
          example: Ida à faculdade
        codigoEstilo:
          oneOf:
          - $ref: '#/components/schemas/Estilo'
          - type: 'null'
        conjuntoFavorito:
          type: boolean
          example: false
        pecas:
          type: array
          items:
            $ref: '#/components/schemas/PecaNoConjunto'
        usos:
          type: integer
          minimum: 0
          example: 3
      required:
      - idConjunto
      - nome
      - codigoEstilo
      - conjuntoFavorito
      - pecas
      - usos
    PecaNoConjunto:
      type: object
      properties:
        idPeca:
          type: integer
          minimum: 1
          example: 42
        miniaturaUrl:
          type:
          - string
          - 'null'
          format: uri
          example: https://storage.exemplo/pecas/7/thumb_42.webp?assinatura=…
        eliminada:
          type: boolean
          example: false
      required:
      - idPeca
      - eliminada
    FicheiroImagem:
      type: object
      properties:
        ficheiro:
          type: string
          format: binary
          description: JPEG, PNG ou WebP, até 5 MB
      required:
      - ficheiro
    Foto:
      type: object
      properties:
        foto:
          type: string
          example: pecas/7/2b1f0c.jpg
          description: Caminho no bucket, a enviar em POST /pieces
        url:
          type: string
          format: uri
          example: https://storage.exemplo/pecas/7/2b1f0c.jpg?assinatura=…
      required:
      - foto
      - url
    ConjuntoFavorito:
      type: object
      properties:
        conjuntoFavorito:
          type: boolean
          example: true
      required:
      - conjuntoFavorito
    Favorita:
      type: object
      properties:
        favorita:
          type: boolean
          example: true
      required:
      - favorita
    PecaAlterar:
      type: object
      properties:
        nome:
          type: string
          example: Casaco de chuva
          minLength: 1
          maxLength: 45
        idCategoria:
          type: integer
          minimum: 1
          example: 3
        estacao:
          type: array
          items:
            $ref: '#/components/schemas/Estacao'
          minItems: 1
          uniqueItems: true
        corNome:
          type: string
          example: preto
          maxLength: 45
        corCodigo:
          type: string
          example: '#000000'
          pattern: ^#[0-9A-Fa-f]{6}$
        etiquetasMeteo:
          type: array
          items:
            type: integer
            minimum: 1
            example: 2
          uniqueItems: true
        foto:
          type: string
          example: pecas/7/9a7e11.jpg
          description: Nova foto carregada em POST /photos
      minProperties: 1
    Estacao:
      type: string
      enum:
      - primavera
      - verao
      - outono
      - inverno
      example: outono
    PecaCriar:
      type: object
      properties:
        foto:
          type: string
          example: pecas/7/2b1f0c.jpg
          description: Caminho devolvido por POST /photos (ADD-01)
        nome:
          type: string
          example: Casaco impermeável
          minLength: 1
          maxLength: 45
        idCategoria:
          type: integer
          minimum: 1
          example: 3
        estacao:
          type: array
          items:
            $ref: '#/components/schemas/Estacao'
          minItems: 1
          uniqueItems: true
        corNome:
          type: string
          example: azul-marinho
          maxLength: 45
        corCodigo:
          type: string
          example: '#1E3A8A'
          pattern: ^#[0-9A-Fa-f]{6}$
        etiquetasMeteo:
          type: array
          items:
            type: integer
            minimum: 1
            example: 2
          uniqueItems: true
          description: idEtiquetaMeteorologica; pode ir vazia
      required:
      - foto
      - nome
      - idCategoria
      - estacao
      - corNome
      - corCodigo
    Peca:
      allOf:
      - $ref: '#/components/schemas/PecaResumo'
      - type: object
        properties:
          fotoUrl:
            type: string
            format: uri
            example: https://storage.exemplo/pecas/7/42.jpg?assinatura=…
          estadoFoto:
            type: string
            enum:
            - pendente
            - processada
            - falhou
            example: processada
          etiquetasMeteo:
            type: array
            items:
              $ref: '#/components/schemas/EtiquetaMeteorologica'
          dataCriado:
            type: string
            format: date-time
            example: '2026-11-02T18:20:00Z'
          usos:
            type: integer
            minimum: 0
            example: 5
            description: Vezes que a peça foi usada (RegistoUsoPeca)
        required:
        - fotoUrl
        - estadoFoto
        - etiquetasMeteo
        - dataCriado
    PecaResumo:
      type: object
      properties:
        idPeca:
          type: integer
          minimum: 1
          example: 42
        nome:
          type: string
          example: Casaco impermeável
        categoria:
          $ref: '#/components/schemas/Categoria'
        estacao:
          type: array
          items:
            $ref: '#/components/schemas/Estacao'
        corNome:
          type: string
          example: azul-marinho
        corCodigo:
          type: string
          example: '#1E3A8A'
          pattern: ^#[0-9A-Fa-f]{6}$
        miniaturaUrl:
          type:
          - string
          - 'null'
          format: uri
          example: https://storage.exemplo/pecas/7/thumb_42.webp?assinatura=…
        favorita:
          type: boolean
          example: true
      required:
      - idPeca
      - nome
      - categoria
      - estacao
      - corNome
      - corCodigo
      - favorita
    Categoria:
      type: object
      properties:
        idCategoria:
          type: integer
          minimum: 1
          example: 3
        nome:
          type: string
          example: Casacos
      required:
      - idCategoria
      - nome
    EtiquetaMeteorologica:
      type: object
      properties:
        idEtiquetaMeteorologica:
          type: integer
          minimum: 1
          example: 2
        codigo:
          type: string
          example: chuva
        nomeApresentado:
          type: string
          example: Chuva
        grupo:
          type: string
          enum:
          - temperatura
          - condicao
          example: condicao
      required:
      - idEtiquetaMeteorologica
      - codigo
      - nomeApresentado
      - grupo
    Erro:
      type: object
      properties:
        codigo:
          type: string
          example: NAO_ENCONTRADO
        mensagem:
          type: string
          example: Recurso não encontrado.
        campos:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
                example: nome
              erro:
                type: string
                example: máximo 45 caracteres
          description: Só nos erros de validação (422)
      required:
      - codigo
      - mensagem
    ExportacaoGuardaRoupa:
      type: object
      properties:
        pecas:
          type: array
          items:
            $ref: '#/components/schemas/Peca'
        conjuntos:
          type: array
          items:
            $ref: '#/components/schemas/Conjunto'
        historico:
          type: array
          items:
            $ref: '#/components/schemas/RegistoUso'
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/Evento'
      required:
      - pecas
      - conjuntos
      - historico
      - eventos
    Evento:
      type: object
      properties:
        idEvento:
          type: integer
          minimum: 1
          example: 15
        titulo:
          type: string
          example: Jantar de curso
        dataEvento:
          type: string
          format: date
          example: '2026-12-12'
        horaInicio:
          type:
          - string
          - 'null'
          example: '20:00'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        local:
          type:
          - string
          - 'null'
          example: Ponta Delgada
        nota:
          type:
          - string
          - 'null'
          example: Levar casaco
        conjunto:
          type:
          - object
          - 'null'
          properties:
            idConjunto:
              type: integer
              minimum: 1
              example: 9
            nome:
              type: string
              example: Ida à faculdade
          required:
          - idConjunto
          - nome
      required:
      - idEvento
      - titulo
      - dataEvento
    RegistoUso:
      type: object
      properties:
        idRegistoUso:
          type: integer
          minimum: 1
          example: 130
        dataUso:
          type: string
          format: date
          example: '2026-11-19'
        idConjunto:
          type:
          - integer
          - 'null'
          minimum: 1
          example: 9
        nomeConjunto:
          type: string
          example: Ida à faculdade
        origem:
          type: string
          enum:
          - sugestao
          - manual
          - evento
          example: manual
        condicaoMeteo:
          type:
          - string
          - 'null'
          example: chuva
        temperatura:
          type:
          - number
          - 'null'
          example: 17.5
        pecas:
          type: array
          items:
            $ref: '#/components/schemas/PecaNoConjunto'
      required:
      - idRegistoUso
      - dataUso
      - nomeConjunto
      - origem
      - pecas
  responses:
    NaoEncontrado:
      description: Não existe ou não pertence ao utilizador (404 em vez de 403, NFR-05)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: NAO_ENCONTRADO
            mensagem: Recurso não encontrado.
    Validacao:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: VALIDACAO
            mensagem: Há campos inválidos.
            campos:
            - campo: nome
              erro: máximo 45 caracteres
    ChaveInterna:
      description: Falta ou é inválida a chave interna (X-Internal-Api-Key)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: NAO_AUTORIZADO
            mensagem: Chave interna inválida.
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: idUtilizador que a EAPI obteve a partir do `sub` do access token do Auth0. Nunca vem do pedido da app.
      schema:
        type: integer
        minimum: 1
        example: 7
